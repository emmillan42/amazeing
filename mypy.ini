# mypy skips hidden directories such as .venv, but not venv/ or env/,
# and build/ holds a second copy of mazegen after building the wheel,
# which makes `mypy .` stop with a duplicate-module error.
#
# mypy reads this file before pyproject.toml: keep every mypy option
# here and do not add a [tool.mypy] section to pyproject.toml.
[mypy]
exclude = (?x)(
    ^build/
    | ^dist/
    | ^venv/
    | ^env/
  )
