[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Un motor generador de laberintos reutilizable en Python"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [
    {name = "emmillan y lugarcia"}
]

[tool.setuptools.packages.find]
# Indica que solo queremos empaquetar la carpeta 'mazegen'
include = ["mazegen*"]