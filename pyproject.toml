[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator: perfect mazes and playable boards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "emmmilla"},
    {name = "lugarcia"},
]

[tool.setuptools.packages.find]
include = ["mazegen*"]
